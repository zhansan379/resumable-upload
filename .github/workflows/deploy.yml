name: deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REMOTE_DIR: /opt/resumable-upload

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: 检查是否已配置服务器 Secrets
        id: guard
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "未配置 SSH_HOST/SSH_USER/SSH_PRIVATE_KEY Secrets，本次跳过部署（配置后 push 即自动部署）"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建 jar
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 构建 dist
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 编译后端
        if: steps.guard.outputs.skip != 'true'
        working-directory: backend
        run: |
          mvn -q -B -DskipTests package
          cp target/resumable-upload-backend-*.jar app.jar

      - name: 构建前端
        if: steps.guard.outputs.skip != 'true'
        working-directory: frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: 打包构建产物（约 22MB，避免跨境传输整镜像）
        if: steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p /tmp/pkg/backend /tmp/pkg/frontend
          cp backend/app.jar backend/Dockerfile.artifact /tmp/pkg/backend/
          cp frontend/Dockerfile.artifact frontend/nginx.conf /tmp/pkg/frontend/
          cp -r frontend/dist /tmp/pkg/frontend/
          cp docker-compose.prod.yml /tmp/pkg/
          tar -C /tmp/pkg -czf /tmp/artifacts.tgz .
          du -h /tmp/artifacts.tgz

      - name: 写入部署私钥
        if: steps.guard.outputs.skip != 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: 上传产物并部署
        if: steps.guard.outputs.skip != 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          run_ssh() {
            ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes \
                -o StrictHostKeyChecking=accept-new \
                "$SSH_USER@$SSH_HOST" "$@"
          }
          # 基础镜像保障：本机没有时先直拉，失败再走国内镜像源引用拉取+重打标签
          ensure_base() {
            local img=$1
            docker images --format '{{.Repository}}:{{.Tag}}' | grep -qx "$img" && return 0
            docker pull -q "$img" 2>/dev/null && return 0
            for M in docker.1ms.run docker.m.daocloud.io; do
              if docker pull -q "$M/library/$img" 2>/dev/null; then
                docker tag "$M/library/$img" "$img" && return 0
              fi
            done
            echo "基础镜像 $img 拉取失败" >&2; return 1
          }
          run_ssh "mkdir -p $REMOTE_DIR"
          cat /tmp/artifacts.tgz | run_ssh "tar -xzf - -C $REMOTE_DIR"
          run_ssh "cd $REMOTE_DIR \
            && ensure_base eclipse-temurin:17-jre \
            && ensure_base nginx:1.27-alpine \
            && docker build -q -t resumable-upload-backend -f backend/Dockerfile.artifact backend/ \
            && docker build -q -t resumable-upload-nginx  -f frontend/Dockerfile.artifact frontend/ \
            && docker compose -f docker-compose.prod.yml up -d"
          for i in $(seq 1 60); do
            if run_ssh "curl -fsS http://localhost:8080/api/files >/dev/null 2>&1"; then
              echo "部署成功: http://$SSH_HOST:8080"
              exit 0
            fi
            sleep 2
          done
          echo "健康检查超时，请上服务器查看: docker compose -f $REMOTE_DIR/docker-compose.prod.yml logs" >&2
          exit 1
