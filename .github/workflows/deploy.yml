name: deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REMOTE_DIR: /opt/resumable-upload

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # 镜像全名：crpi-xxx.cn-beijing.personal.cr.aliyuncs.com/resumable-upload/resumable-upload
      ACR_IMAGE: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/resumable-upload
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: 检查是否已配置部署 Secrets
        id: guard
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$ACR_NAMESPACE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "未配置 SSH_* 或 ACR_* Secrets，本次跳过部署"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建 jar
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 构建 dist
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 编译后端
        if: steps.guard.outputs.skip != 'true'
        working-directory: backend
        run: |
          mvn -q -B -DskipTests package
          cp target/resumable-upload-backend-*.jar app.jar

      - name: 构建前端
        if: steps.guard.outputs.skip != 'true'
        working-directory: frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: 组装镜像并推送 ACR
        if: steps.guard.outputs.skip != 'true'
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_DOCKER_USERNAME: ${{ secrets.ACR_DOCKER_USERNAME }}
          ACR_DOCKER_PASSWORD: ${{ secrets.ACR_DOCKER_PASSWORD }}
        run: |
          # 产物模式单镜像：app.jar + 前端静态资源 + 薄运行时
          STAGE=$(mktemp -d)
          cp backend/app.jar "$STAGE/app.jar"
          cp -r frontend/dist "$STAGE/static"
          cp Dockerfile.artifact "$STAGE/"
          docker build -t "$ACR_IMAGE:app" -t "$ACR_IMAGE:app-${GITHUB_SHA::8}" -f "$STAGE/Dockerfile.artifact" "$STAGE"
          echo "$ACR_DOCKER_PASSWORD" | docker login "$ACR_REGISTRY" --username "$ACR_DOCKER_USERNAME" --password-stdin
          # 同时推 sha tag 便于回滚（层已上传，第二个 tag 推送成本极低）
          docker push "$ACR_IMAGE:app" && docker push "$ACR_IMAGE:app-${GITHUB_SHA::8}"

      - name: 写入部署私钥
        if: steps.guard.outputs.skip != 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: 服务器拉取镜像并部署
        if: steps.guard.outputs.skip != 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: |
          run_ssh() {
            ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes \
                -o StrictHostKeyChecking=accept-new \
                "$SSH_USER@$SSH_HOST" "$@"
          }
          # ECS 与 ACR 同地域时走 VPC 内网域名拉取（免流量、秒级），否则走公网域名
          REGION=$(run_ssh "curl -s -m 3 http://100.100.100.200/latest/meta-data/region-id || echo unknown")
          PULL_REG="$ACR_REGISTRY"
          if [ "$REGION" = "cn-beijing" ]; then
            PULL_REG="${ACR_REGISTRY/.cn-beijing.personal.cr/-vpc.cn-beijing.personal.cr}"
          fi
          echo "拉取域名: $PULL_REG (ECS 地域: $REGION)"
          run_ssh "
            set -e
            docker pull $PULL_REG/resumable-upload/resumable-upload:app
            docker tag  $PULL_REG/resumable-upload/resumable-upload:app resumable-upload:latest
            cd $REMOTE_DIR && docker compose -f docker-compose.prod.yml up -d --remove-orphans
          "
          for i in $(seq 1 60); do
            if run_ssh "curl -fsS http://localhost:8080/api/files >/dev/null 2>&1 && curl -fsS http://localhost:8080/ >/dev/null"; then
              echo "部署成功: http://$SSH_HOST:8080"
              exit 0
            fi
            sleep 2
          done
          echo "健康检查超时，请上服务器查看: docker compose -f $REMOTE_DIR/docker-compose.prod.yml logs" >&2
          exit 1
