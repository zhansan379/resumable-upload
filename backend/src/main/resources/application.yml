server:
  port: 8080
  compression:
    # 替代 nginx 的 gzip：静态资源与 JSON 响应压缩
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json
    min-response-size: 1KB

spring:
  application:
    name: resumable-upload
  servlet:
    multipart:
      # 限制的是"单个分片"的大小，前端默认分片 5MB，留足余量
      max-file-size: 20MB
      max-request-size: 25MB
      file-size-threshold: 1MB

app:
  # 单容器模式：前端静态资源目录（由 Spring Boot 直接托管）
  # Docker 镜像内设为 /app/static；本地 vite 开发时留空
  static-dir: ${STATIC_DIR:}
  upload:
    # 存储后端：local（本地磁盘，默认）| s3（S3 兼容对象存储：MinIO / RustFS / AWS S3 / OSS / COS / OBS ...）
    storage:
      type: local
      # s3 后端示例（本地 MinIO）：
      # s3:
      #   endpoint: http://127.0.0.1:9000
      #   region: us-east-1            # MinIO/RustFS 任意值即可
      #   bucket: resumable-upload
      #   access-key: minioadmin
      #   secret-key: minioadmin
      #   key-prefix: files            # 最终对象 key = {key-prefix}/{fileHash}
      #   path-style-access: true      # MinIO/RustFS 必须为 true
    # 上传根目录：分片临时目录、最终文件目录、hash 索引都放在这里（local 后端）
    # Docker 部署时通过环境变量 UPLOAD_DIR=/data/upload 覆盖
    base-dir: ${UPLOAD_DIR:./data/upload}
    # 合并完成后是否异步重算 MD5 校验完整性（不阻塞合并响应）
    verify-md5-after-merge: true
    # 单文件总大小上限
    max-total-size: 20GB
    # 分片数量上限
    max-total-chunks: 100000
    # 孤儿分片目录保留时长：客户端消失（崩溃/断网/关页面）后无人调用取消接口，
    # 超过该时长未更新的分片目录由定时任务（每小时）清理
    chunk-ttl: 24h
