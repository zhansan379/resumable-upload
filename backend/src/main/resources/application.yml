server:
  port: 8080

spring:
  application:
    name: resumable-upload
  servlet:
    multipart:
      # 限制的是"单个分片"的大小，前端默认分片 5MB，留足余量
      max-file-size: 20MB
      max-request-size: 25MB
      file-size-threshold: 1MB

app:
  upload:
    # 上传根目录：分片临时目录、最终文件目录、hash 索引都放在这里
    # Docker 部署时通过环境变量 UPLOAD_DIR=/data/upload 覆盖
    base-dir: ${UPLOAD_DIR:./data/upload}
    # 合并完成后是否异步重算整体 MD5 做完整性校验（不阻塞合并响应）
    verify-md5-after-merge: true
    # 单文件总大小上限
    max-total-size: 20GB
    # 分片数量上限
    max-total-chunks: 100000
