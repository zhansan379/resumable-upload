# 生产部署（产物模式）：镜像由 CI 或 deploy.sh 构建并推送到服务器，
# 服务器上只 docker pull/load + up，不做任何编译。
# 镜像名与 docker-compose.yml 保持一致。
services:
  app:
    image: resumable-upload:latest
    restart: unless-stopped
    environment:
      UPLOAD_DIR: /data/upload
      STATIC_DIR: /app/static
      # JMX 仅绑定宿主机 127.0.0.1（compose 端口映射同样只绑 127.0.0.1），供 VisualVM/采样器经 SSH 隧道监控，不暴露公网
      JAVA_OPTS: "-Xms64m -Xmx256m -Dcom.sun.management.jmxremote.port=9010 -Dcom.sun.management.jmxremote.rmi.port=9010 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.local.only=false -Djava.rmi.server.hostname=127.0.0.1"
    volumes:
      - upload-data:/data/upload
    ports:
      - "8080:8080"
      - "127.0.0.1:9010:9010"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  upload-data:
