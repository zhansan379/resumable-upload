# 生产部署（产物模式）：镜像由 CI 或 deploy.sh 在本地/Runner 构建后推送到服务器，
# 服务器上只 docker load + up，不做任何编译。镜像名与 docker-compose.yml 保持一致。
services:
  backend:
    image: resumable-upload-backend
    restart: unless-stopped
    environment:
      UPLOAD_DIR: /data/upload
      JAVA_OPTS: "-Xms64m -Xmx256m"
    volumes:
      # 上传的分片与最终文件持久化在命名卷里，重建容器不丢数据
      - upload-data:/data/upload
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          # 与 Xmx256m 匹配，保护同机其他业务
          memory: 512M

  nginx:
    image: resumable-upload-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 80 被同机现有 nginx 占用，本项目对外使用 8080
      - "8080:80"

volumes:
  upload-data:
