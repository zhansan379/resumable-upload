# 生产部署（产物模式）：镜像由 CI 或 deploy.sh 构建并推送到服务器，
# 服务器上只 docker pull/load + up，不做任何编译。
# 镜像名与 docker-compose.yml 保持一致。
services:
  app:
    image: resumable-upload:latest
    restart: unless-stopped
    environment:
      UPLOAD_DIR: /data/upload
      STATIC_DIR: /app/static
      JAVA_OPTS: "-Xms64m -Xmx256m"
    volumes:
      - upload-data:/data/upload
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  upload-data:
