# 单容器部署：Spring Boot 单进程同时提供 /api 与前端静态资源。
# `docker compose up -d --build` 自包含构建（内部执行 Maven + Vite 构建）。
services:
  app:
    build: .
    image: resumable-upload:latest
    restart: unless-stopped
    environment:
      UPLOAD_DIR: /data/upload
      STATIC_DIR: /app/static
      JAVA_OPTS: "-Xms64m -Xmx256m"
    volumes:
      # 上传的分片与最终文件持久化在命名卷里，重建容器不丢数据
      - upload-data:/data/upload
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  upload-data:
